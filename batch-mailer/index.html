  <body>
    <!--
    DIRECTION CONTRACT
    THESIS: A job-scanning tool that reads like a physical filing
    system — paper, folders, stamps, and typewriter labels. The
    category default is "clean SaaS dashboard" — this refuses it
    by treating every screen as a document on a desk.
    OWN-WORLD: Warm cream paper (#f5f0eb) ground, white document
    cards, warm-gray borders. DM Serif Display for headings,
    Inter for body, IBM Plex Mono for labels and code. Navy
    (#1e3a5f) for primary actions, stamp-red (#c0392b) for errors
    and accents. Folder tabs as navigation.
    STORY: The visitor drops a job posting screenshot onto their
    desk. The AI scans it, stamps the result, and the email goes
    out — all without leaving the paper metaphor.
    FIRST VIEWPORT: Folder tab bar at top (Scan | Settings).
    Below it, a Gmail connection card, three status stamps, then
    a large dashed-border drop zone.
    FORM: Archive/Document, position 1 on the user's list.
    FINISH: unreviewed and undocumented is unfinished; this build
    ends with the finish review, the verdict, DESIGN.md, and
    every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
